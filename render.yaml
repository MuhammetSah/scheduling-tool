# Render blueprint: creates the API and its database in one step.
# Point Render at this repository and it will pick this file up.
#
# Two values still have to be set by hand in the Render dashboard, because they
# depend on where the frontend ends up and on your mail provider:
#   ALLOWED_ORIGINS  - the deployed frontend's origin, e.g. https://schichtplan.vercel.app
#   APP_BASE_URL     - the same origin; invitation links are built from it
#   SMTP_*           - see the README; without them invitations are only logged
services:
  - type: web
    name: schichtplan-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Der Planer rechnet bis zu 8 Sekunden (DEFAULT_TIME_BUDGET_SECONDS in
    # scheduler.py). Mit einem einzigen synchronen Worker antwortet die API in
    # dieser Zeit niemandem sonst. Vier Threads halten den Rest bedienbar;
    # --timeout 60 laesst dem Planer Luft, ohne einen wirklich haengenden
    # Worker ewig stehen zu lassen.
    #
    # Ein Worker, nicht zwei: Threads teilen sich den Speicher des Prozesses,
    # ein zweiter Worker verdoppelt ihn. Der kostenlose Plan hat 512 MB, und
    # der Grund, der urspruenglich fuer zwei Worker sprach, ist entfallen -
    # das Migrations-Rennen ist seit dem Postgres-Advisory-Lock in
    # migrations.py im Code geschlossen, nicht mehr nur durch --preload. Was
    # von mehreren Workern uebrig bliebe, waere Nebenlaeufigkeit waehrend
    # einer Planberechnung, und die liefern Threads hier zum Nulltarif.
    # Wer spaeter doch aufstockt, sollte vorher den Speicherverbrauch messen.
    #
    # Jeder Request oeffnet eine eigene DB-Verbindung (siehe db.py/app.py
    # get_db()), also sind hoechstens 1 Worker * 4 Threads = 4 gleichzeitige
    # Verbindungen zu erwarten - klein gemessen an ueblichen Postgres-Grenzen,
    # aber die genaue Verbindungsobergrenze des kostenlosen Plans wurde nicht
    # geprueft.
    #
    # --preload: app.py ruft init_db() (-> migrations.apply_pending()) beim
    # Import auf. Ohne --preload importiert jeder geforkte Worker app.py fuer
    # sich selbst, mit nur 0-100ms Versatz zwischen den Forks (siehe
    # gunicorn/arbiter.py) - bei einem Deploy mit offener Migration koennen
    # dann zwei Worker gleichzeitig apply_pending() ausfuehren. Das ist kein
    # harmloser Einzel-Worker-Neustart: schlaegt ein Worker beim Boot fehl,
    # meldet Gunicorn WORKER_BOOT_ERROR, reap_workers() wirft HaltServer, und
    # der Arbiter beendet den gesamten Dienst - auch den Worker, der die
    # Migration bereits erfolgreich angewandt hat. --preload laesst den
    # Import (und damit init_db()) genau einmal im Master-Prozess vor dem
    # Fork laufen, wodurch das Rennen entfaellt. Sicher hier, weil init_db()
    # seine DB-Verbindung noch vor der Rueckkehr wieder schliesst (siehe
    # migrations.py apply_pending(), finally: connection.close()) und app.py
    # sonst keine Ressource (Socket, Datei, Thread) offen haelt, die ein
    # Fork problematisch erben wuerde - logging.basicConfig() schreibt nur
    # nach stderr, das jeder Kindprozess ohnehin von Gunicorn erbt.
    #
    # Mit nur einem Worker kann das Rennen ohnehin nicht auftreten, und der
    # Advisory-Lock deckt es zusaetzlich ab. --preload bleibt trotzdem
    # stehen: es kostet nichts und ist die Absicherung fuer den Tag, an dem
    # jemand die Worker-Zahl erhoeht, ohne diesen Kommentar zu lesen.
    #
    # ACHTUNG: Ein im Render-Dashboard eingetragener Start Command
    # ueberschreibt diese Zeile vollstaendig. Wer hier etwas aendert, muss
    # pruefen, ob der Dienst nicht in Wirklichkeit einem Dashboard-Wert
    # folgt - genau das war hier schon einmal der Fall.
    startCommand: >-
      gunicorn app:app --bind 0.0.0.0:$PORT --preload
      --threads 4 --timeout 60 --access-logfile -
    # /health statt /: die Wurzel beweist nur, dass Python laeuft. Zeigte die
    # Pruefung dorthin, hielte Render einen Dienst fuer gesund, dessen
    # saemtliche Anfragen mit 500 enden, weil die Datenbank fehlt - genau der
    # wahrscheinlichste Fehler beim Datenbankwechsel.
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: schichtplan-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false

databases:
  - name: schichtplan-db
    plan: free
