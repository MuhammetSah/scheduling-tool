# Render blueprint: creates the API and its database in one step.
# Point Render at this repository and it will pick this file up.
#
# Two values still have to be set by hand in the Render dashboard, because they
# depend on where the frontend ends up and on your mail provider:
#   ALLOWED_ORIGINS  - the deployed frontend's origin, e.g. https://schichtplan.vercel.app
#   APP_BASE_URL     - the same origin; invitation links are built from it
#   SMTP_*           - see the README; without them invitations are only logged
services:
  - type: web
    name: schichtplan-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Der Planer rechnet bis zu 8 Sekunden (DEFAULT_TIME_BUDGET_SECONDS in
    # scheduler.py). Mit einem einzigen synchronen Worker antwortet die API in
    # dieser Zeit niemandem sonst. Zwei Worker mit je vier Threads halten den
    # Rest bedienbar; --timeout 60 laesst dem Planer Luft, ohne einen wirklich
    # haengenden Worker ewig stehen zu lassen. Jeder Request oeffnet eine
    # eigene DB-Verbindung (siehe db.py/app.py get_db()), also sind hoechstens
    # 2 Worker * 4 Threads = 8 gleichzeitige Verbindungen zu erwarten - das
    # sollte im kostenlosen Postgres-Plan unproblematisch sein, aber die
    # genaue Verbindungsobergrenze dieses Plans wurde nicht geprueft.
    startCommand: >-
      gunicorn app:app --bind 0.0.0.0:$PORT
      --workers 2 --threads 4 --timeout 60 --access-logfile -
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: schichtplan-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false

databases:
  - name: schichtplan-db
    plan: free
