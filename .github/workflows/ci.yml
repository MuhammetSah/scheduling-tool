name: CI

on:
  # Nur main, sonst laeuft CI fuer einen Pull-Request-Branch zweimal: einmal
  # ueber push (jeder Branch, ohne Filter) und einmal ueber pull_request -
  # fuer denselben Commit derselbe Suite, doppelt bezahlt.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 ist die Produktionsversion (siehe render.yaml). 3.14 laeuft
        # mit, damit lokale Entwicklung darauf nicht unbemerkt abdriftet.
        python-version: ['3.13', '3.14']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Abhaengigkeiten installieren
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Abhaengigkeiten installieren
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
