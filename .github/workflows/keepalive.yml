name: Keep backend awake

# Render's free plan spins the API down after ~15 minutes without a request,
# so the next real visitor pays a ~60s cold start (see README > Deployment).
# This pings it every 14 minutes to keep it warm during the hours people
# actually use the tool.
#
# Runs around the clock. This used to cover only 05:00-20:00 UTC, because
# Actions on a free *private* repo includes 2,000 minutes/month billed in
# whole minutes per run, and a 24/7 cadence tight enough to beat the
# 15-minute sleep window would have blown past that budget. This repository
# is public, and Actions minutes are unmetered for public repositories, so
# the constraint that shaped the old schedule no longer applies. If it is
# ever made private again, restore a limited window - `*/14 5-19 * * *` was
# the previous setting, at roughly 1,950 runs/month.
#
# IMPORTANT: GitHub only evaluates a workflow's `schedule` trigger from the
# copy of this file on the repository's default branch - it has no effect
# on a feature branch until merged.
#
# Also note: GitHub disables scheduled workflows in a repository with no
# activity for 60 days, and re-enabling is manual. A repository that goes
# quiet for two months will quietly stop pinging, and the first visitor
# after that pays the cold start again.
#
# Manual runs (workflow_dispatch) work as a one-off nudge regardless of branch.

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API
        run: curl -fsS -m 30 https://schichtplan-api.onrender.com/ || true
